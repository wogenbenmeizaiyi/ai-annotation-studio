name: ai-annotation-studio-service

services:
  api:
    image: ai_annotation_studio_service:latest
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ai_annotation_studio_service_deps:latest}
    container_name: ai_annotation_studio_service_api
    restart: unless-stopped
    shm_size: 8gb
    env_file:
      - .env
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TRAIN_DATA_DIR: ${TRAIN_DATA_DIR:-/app/storage/train_data}
      YOLO_MODEL_DIR: ${YOLO_MODEL_DIR:-/app/models/yolo_models}
      SAM3_MODEL_PATH: ${SAM3_MODEL_PATH:-/app/models/sam3.pt}
      AGENT_LOG_FILE: /app/logs/agent.log
    gpus:
      - driver: nvidia
        device_ids:
          - "0"
        capabilities:
          - gpu
    ports:
      - "8811:8811"
    volumes:
      - ./logs:/app/logs
      - ./storage:/app/storage
      - ./runs:/app/runs
    command: >
      sh -c "python -m uvicorn app.main:app --host 0.0.0.0 --port 8811
      >> /app/logs/api.log 2>&1"
    networks:
      - gateway-net

networks:
  gateway-net:
    external: true
