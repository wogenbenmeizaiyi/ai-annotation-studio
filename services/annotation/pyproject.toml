[project]
name = "ai-annotation-studio-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "boto3>=1.42.90",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "numpy>=2.4.4",
    "openai>=2.46.0",
    "opencv-python>=4.13.0.92",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "pyjwt[crypto]>=2.10.1",
    "redis>=7.3.0",
    "sqlalchemy>=2.0.49",
    "timm>=1.0.26",
    "torch",
    "torchvision",
    "ultralytics>=8.4.37",
    "uvicorn>=0.44.0",
    "websockets>=16.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
