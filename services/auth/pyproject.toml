[project]
name = "ai-annotation-studio-auth"
version = "0.1.0"
description = "Authentication service for AI Annotation Studio"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "cryptography>=46.0.0",
    "fastapi>=0.135.3",
    "pwdlib[argon2]>=0.3.0",
    "psycopg2-binary>=2.9.11",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv>=1.2.2",
    "redis>=7.3.0",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
