[project]
name = "rabbitmq-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.0",
    "celery[redis]>=5.6.3",
    "dotenv>=0.9.9",
    "flower>=2.0.1",
    "pika>=1.3.2",
    "pike>=0.2.0",
    "ultralytics>=8.1.0",
    "timm>=1.0.27",
    "torch",
    "torchvision",
    "pillow>=10.2.0",
    "requests>=2.33.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "fastapi>=0.135.3",
    "python-multipart>=0.0.20",
    "uvicorn>=0.44.0",
    "boto3>=1.42.88",
    "sqlalchemy>=2.0.49",
    "psycopg2-binary>=2.9.11",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    "api/src",
    "worker/src",
    "consumer/src",
    "core/src",
    "engine/src",
]

[tool.ruff]
target-version = "py312"
line-length = 88
