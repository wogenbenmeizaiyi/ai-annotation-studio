services:
  api:
    image: image_detection_service_api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        BASE_IMAGE: ${BASE_IMAGE:-image_detection_service_deps:latest}
    container_name: image_detection_service_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    gpus:
      - driver: nvidia
        device_ids:
          - "0"
        capabilities:
          - gpu
    ports:
      - "7987:7987"
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    command: >
      sh -c "python -m uvicorn api_server:app --host 0.0.0.0 --port 7987
      >> /app/logs/api.log 2>&1"
    networks:
      - gateway-net

  worker-gpu:
    image: ai-studio-recognition-worker-gpu:latest
    build:
      context: .
      dockerfile: Dockerfile.worker-gpu
      args:
        BASE_IMAGE: ${BASE_IMAGE:-image_detection_service_deps:latest}
    container_name: image_detection_service_worker_gpu
    hostname: recognition-worker-gpu
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    gpus:
      - driver: nvidia
        device_ids:
          - "0"
        capabilities:
          - gpu
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    command: >
      python -m celery -A worker_server_gpu.celery_app worker
      --loglevel=info
      --logfile=/app/logs/worker-gpu.log
      --hostname=recognition-gpu@%h
      --pidfile=/tmp/celery-gpu.pid
      --pool=solo
      -Q tasks.image.recognition.yolo,tasks.image.recognition.sam
      --prefetch-multiplier=1
      --concurrency=1

  worker-multimodal:
    image: ai-studio-recognition-worker-multimodal:latest
    build:
      context: .
      dockerfile: Dockerfile.worker-multimodal
    container_name: image_detection_service_worker_multimodal
    hostname: recognition-worker-multimodal
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    command: >
      python -m celery -A worker_server_multimodal.celery_app worker
      --loglevel=info
      --logfile=/app/logs/worker-multimodal.log
      --hostname=recognition-multimodal@%h
      --pidfile=/tmp/celery-multimodal.pid
      --pool=threads
      -Q tasks.image.recognition.multimodal
      --prefetch-multiplier=1
      --concurrency=4

  consumer:
    image: image_detection_service_consumer:latest
    build:
      context: .
      dockerfile: Dockerfile.consumer
      args:
        BASE_IMAGE: ${BASE_IMAGE:-image_detection_service_deps:latest}
    container_name: image_detection_service_consumer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUTF8=1
      - PYTHONIOENCODING=utf-8
    volumes:
      - ./logs:/app/logs
    command: >
      sh -c "python -m result_consumer
      >> /app/logs/consumer.log 2>&1"

networks:
  gateway-net:
    external: true
