stages:
  - deploy

variables:
  GIT_DEPTH: '1'

# 无容器镜像仓库方案：不构建/推送镜像。
# main 分支提交时触发：SSH 到服务器 git pull 最新代码 + 还原 .env，
# 服务器本地构建镜像并用 compose 启动（scripts/deploy-remote.sh）。
deploy:server:
  stage: deploy
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        paths:
          - apps/web/**/*
          - services/annotation/**/*
          - services/auth/**/*
          - services/recognition/**/*
          - scripts/deploy-remote.sh
          - infra/**/*
          - .gitlab-ci.yml
      when: on_success
    - when: never
  variables:
    # 与 ai-annotation-studio-web 项目一致的部署参数（直接写死，不依赖项目变量）
    DEPLOY_HOST: "172.16.0.72"
    DEPLOY_PORT: "22"
    DEPLOY_USER: "weiyn"
    DEPLOY_PATH: "/home/weiyn/projects/ai-annotation-studio"
    DEPLOY_ORIGIN: "http://172.16.0.72:7280"
    DEPLOY_REPO_URL: "http://172.16.0.110:802/product/ai-server/ai-annotation-studio.git"
    DEPLOY_KEY: $DEPLOY_KEY
    # 业务连接变量（来自 GitLab 项目变量；同名同值共享，冲突键加 AUTH_/ANNOTATION_/RECOGNITION_ 前缀）
    POSTGRES_HOST: $POSTGRES_HOST
    POSTGRES_PORT: $POSTGRES_PORT
    POSTGRES_USER: $POSTGRES_USER
    POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    AUTH_POSTGRES_DB: $AUTH_POSTGRES_DB
    ANNOTATION_POSTGRES_DB: $ANNOTATION_POSTGRES_DB
    RECOGNITION_POSTGRES_DB: $RECOGNITION_POSTGRES_DB
    RECOGNITION_POSTGRES_USER: $RECOGNITION_POSTGRES_USER
    RECOGNITION_POSTGRES_PASSWORD: $RECOGNITION_POSTGRES_PASSWORD
    REDIS_HOST: $REDIS_HOST
    REDIS_PORT: $REDIS_PORT
    REDIS_PASSWORD: $REDIS_PASSWORD
    AUTH_REDIS_DB: $AUTH_REDIS_DB
    RECOGNITION_REDIS_DB: $RECOGNITION_REDIS_DB
    RABBITMQ_HOST: $RABBITMQ_HOST
    RABBITMQ_PORT: $RABBITMQ_PORT
    RABBITMQ_USER: $RABBITMQ_USER
    RABBITMQ_PASS: $RABBITMQ_PASS
    RABBITMQ_VHOST: $RABBITMQ_VHOST
    RABBITMQ_YOLO_QUEUE_NAME: $RABBITMQ_YOLO_QUEUE_NAME
    RABBITMQ_SAM_QUEUE_NAME: $RABBITMQ_SAM_QUEUE_NAME
    RABBITMQ_MULTIMODAL_QUEUE_NAME: $RABBITMQ_MULTIMODAL_QUEUE_NAME
    MULTIMODAL_WORKER_CONCURRENCY: $MULTIMODAL_WORKER_CONCURRENCY
    S3_ENDPOINT: $S3_ENDPOINT
    S3_PUBLIC_ENDPOINT: $S3_PUBLIC_ENDPOINT
    S3_ACCESS_KEY: $S3_ACCESS_KEY
    S3_SECRET_KEY: $S3_SECRET_KEY
    S3_REGION: $S3_REGION
    S3_SIGNATURE_VERSION: $S3_SIGNATURE_VERSION
    S3_BUCKET_NAME: $S3_BUCKET_NAME
    AGENT_API_KEY: $AGENT_API_KEY
    AGENT_MODEL: $AGENT_MODEL
    AGENT_BASE_URL: $AGENT_BASE_URL
    QWEN_API_KEY: $QWEN_API_KEY
    AUTH_ISSUER: $AUTH_ISSUER
    AUTH_AUDIENCE: $AUTH_AUDIENCE
    AUTH_COOKIE_SECURE: $AUTH_COOKIE_SECURE
    AUTH_ALLOWED_ORIGINS: $AUTH_ALLOWED_ORIGINS
    AUTH_ACCESS_TOKEN_MINUTES: $AUTH_ACCESS_TOKEN_MINUTES
    AUTH_REFRESH_TOKEN_DAYS: $AUTH_REFRESH_TOKEN_DAYS
    PUBLIC_SUBMIT_RATE: $PUBLIC_SUBMIT_RATE
    PUBLIC_DIRECT_RATE: $PUBLIC_DIRECT_RATE
    PUBLIC_QUERY_RATE: $PUBLIC_QUERY_RATE
    PUBLIC_MAX_IMAGES: $PUBLIC_MAX_IMAGES
    PUBLIC_MAX_UPLOAD_BYTES: $PUBLIC_MAX_UPLOAD_BYTES
    PUBLIC_IMAGE_URL_ALLOWLIST: $PUBLIC_IMAGE_URL_ALLOWLIST
    RESOURCE_CHECK_ENABLED: $RESOURCE_CHECK_ENABLED
    RESOURCE_MIN_SYSTEM_MEMORY_MB: $RESOURCE_MIN_SYSTEM_MEMORY_MB
    RESOURCE_MIN_GPU_MEMORY_MB: $RESOURCE_MIN_GPU_MEMORY_MB
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssh-client
    - mkdir -p ~/.ssh
    - printf "%s\n" "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - test -s ~/.ssh/id_ed25519
    - ssh-keygen -y -f ~/.ssh/id_ed25519
    - ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - bash scripts/deploy-remote.sh
